<!DOCTYPE html>
<html>
<head>
    <title>My Image Generator</title>
</head>
    
<body>
   <h1 style="font-size:42px; margin-bottom:10px; text-shadow:0 2px 10px rgba(0,0,0,0.5);">My AI Image Generator</h1>
<head>
    <title>My Image Generator</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
    </style>
  <p style="font-size:18px; color:#bbb; margin-bottom:25px;">
    Describe the image you want to create
</p>

   <textarea id="prompt" rows="6" cols="50"
    placeholder="Describe the image you want to create..."
    style="display:block; width:100%; max-width:600px; height:160px; margin:0 auto 25px; padding:15px; box-sizing:border-box; border-radius:12px; border:1px solid #444; background:#1c1c1c; color:white; font-size:16px; line-height:1.5; resize:vertical;"></textarea>

    <br><br>

  <button onclick="generateImage()" style="padding:14px 30px; font-size:18px; font-weight:bold; color:white; background:#6c5ce7; border:none; border-radius:10px; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.3);">
    ✨ GENERATE IMAGE
</button>

    <br><br>

   <div id="result" style="margin-top:30px;"></div>

<h2 style="margin-top:50px; color:#fff;">🖼️ Image History</h2>

<div id="gallery" style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:20px;"></div>

<button type="button" onclick="clearImage()"
    style="margin-top:20px; padding:12px 24px; font-size:16px; font-weight:bold; color:white; background:#333; border:none; border-radius:8px; cursor:pointer;">
    🗑️ CLEAR / NEW IMAGE
</button>

<button type="button" onclick="deleteAllHistory()"
    style="margin-top:20px; padding:12px 24px; font-size:16px; font-weight:bold; color:white; background:#8b0000; border:none; border-radius:8px; cursor:pointer;">
    🗑️ DELETE ALL HISTORY
</button>
  <script>
    let imageDB = null;

    const dbRequest = indexedDB.open("ImageGeneratorDB", 2);

    dbRequest.onupgradeneeded = function(event) {
        const db = event.target.result;

        if (!db.objectStoreNames.contains("images")) {
            db.createObjectStore("images", { autoIncrement: true });
        }
    };

    dbRequest.onsuccess = function() {
        imageDB = dbRequest.result;
        console.log("Image database ready.");

        loadGallery();
    };

    dbRequest.onerror = function() {
        console.error("Database error:", dbRequest.error);
    };


    async function generateImage() {
        const prompt = document.getElementById("prompt").value;
        const result = document.getElementById("result");

        result.innerHTML = "Generating...";

        try {
            const response = await fetch("/api/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ prompt: prompt })
            });

            if (!response.ok) {
                result.innerHTML = "Something went wrong.";
                return;
            }

            const blob = await response.blob();

            const imageUrl = URL.createObjectURL(blob);

           if (imageDB) {
    const transaction = imageDB.transaction("images", "readwrite");
    const store = transaction.objectStore("images");
    const request = store.add(blob);

    request.onsuccess = function() {
        addGalleryImage(blob, request.result);
    };

    console.log("Image saved to database.");
}

           request.onsuccess = function() {
    addGalleryImage(blob, request.result);
};

            result.innerHTML = `
                <img src="${imageUrl}" style="display:block; max-width:500px; width:100%; height:auto; margin:20px auto;">
                <br>
                <a href="${imageUrl}" download="generated-image.png"
                   style="display:inline-block; padding:12px 24px; background:#333; color:white; text-decoration:none; border-radius:8px; font-weight:bold;">
                    ⬇️ DOWNLOAD IMAGE
                </a>
            `;

        } catch (error) {
            console.error(error);
            result.innerHTML = "Something went wrong.";
        }
    }


    function addGalleryImage(blob, key) {
        const imageUrl = URL.createObjectURL(blob);

        const galleryImage = document.createElement("img");

        galleryImage.src = imageUrl;
        galleryImage.style.width = "200px";
        galleryImage.style.cursor = "pointer";
        galleryImage.style.borderRadius = "10px";

        galleryImage.onclick = function() {
            window.open(imageUrl, "_blank");
        };

       const deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️ DELETE";
deleteButton.style.display = "block";
deleteButton.style.margin = "8px auto 20px";
deleteButton.style.padding = "8px 16px";
deleteButton.style.background = "#8b0000";
deleteButton.style.color = "white";
deleteButton.style.border = "none";
deleteButton.style.borderRadius = "6px";
deleteButton.style.cursor = "pointer";

deleteButton.onclick = function() {
    const transaction = imageDB.transaction("images", "readwrite");
    const store = transaction.objectStore("images");

    const request = store.delete(key);

    request.onsuccess = function() {
        galleryImage.remove();
        deleteButton.remove();
        URL.revokeObjectURL(imageUrl);
    };
};

document.getElementById("gallery").appendChild(galleryImage);
document.getElementById("gallery").appendChild(deleteButton);
    }


    function loadGallery() {
        if (!imageDB) {
            return;
        }

        const transaction = imageDB.transaction("images", "readonly");
        const store = transaction.objectStore("images");
        const request = store.openCursor();

     request.onsuccess = function(event) {
    const cursor = event.target.result;

    if (cursor) {
        addGalleryImage(cursor.value, cursor.key);
        cursor.continue();
    }
};
            
        
    }


   function clearImage() {
    document.getElementById("prompt").value = "";
    document.getElementById("result").innerHTML = "";
}

function deleteAllHistory() {
    if (!imageDB) {
        return;
    }

    const transaction = imageDB.transaction("images", "readwrite");
    const store = transaction.objectStore("images");
    const request = store.clear();

    request.onsuccess = function() {
        document.getElementById("gallery").innerHTML = "";
    };
}
</script> 
</body>
</html>
