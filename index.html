<!DOCTYPE html>
<html>
<head>
    <title>My AI Image Generator</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        textarea {
            display: block;
            width: 100%;
            max-width: 600px;
            height: 160px;
            margin: 0 auto 25px;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid #444;
            background: #1c1c1c;
            color: white;
            font-size: 16px;
            line-height: 1.5;
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        .story-box {
            max-width: 900px;
            margin: 50px auto;
            padding: 25px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 15px;
        }

        .scene {
            background: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1 style="font-size:42px; margin-bottom:10px; text-shadow:0 2px 10px rgba(0,0,0,0.5);">
        My AI Image Generator
    </h1>

    <p style="font-size:18px; color:#bbb; margin-bottom:25px;">
        Describe the image you want to create
    </p>

    <div style="margin-bottom:20px;">
        <label for="aspectRatio" style="font-size:18px; color:#bbb;">
            Image Size:
        </label>

        <select id="aspectRatio"
            style="margin-left:10px; padding:10px; font-size:16px; border-radius:8px; background:#1c1c1c; color:white; border:1px solid #444;">
            <option value="1024x1024">Square (1:1)</option>
            <option value="1152x768">Landscape (3:2)</option>
            <option value="768x1152">Portrait (2:3)</option>
            <option value="1344x768">Wide (16:9)</option>
            <option value="768x1344">Tall (9:16)</option>
        </select>
    </div>

    <textarea
        id="prompt"
        rows="6"
        cols="50"
        placeholder="Describe the image you want to create..."></textarea>

    <button
        onclick="generateImage()"
        style="padding:14px 30px; font-size:18px; font-weight:bold; color:white; background:#6c5ce7; border:none; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.3);">
        ✨ GENERATE IMAGE
    </button>

    <div id="result" style="margin-top:30px;"></div>


    <!-- STORY PLANNER -->

    <div class="story-box">

        <h2>🎬 Story & Paragraph Planner</h2>

        <p style="color:#aaa;">
            Enter a paragraph and let the AI break it into visual scenes.
        </p>

        <textarea
            id="storyPrompt"
            placeholder="Write a story, paragraph, scene, or idea here..."></textarea>

        <button
            onclick="planStory()"
            style="padding:14px 30px; font-size:18px; font-weight:bold; color:white; background:#00a884; border:none; border-radius:10px;">
            🎬 PLAN STORY
        </button>

        <div id="storyResult" style="margin-top:30px;"></div>
<button
    type="button"
    onclick="generateSceneImages()"
    style="margin-top:20px; padding:14px 30px; font-size:18px; font-weight:bold; color:white; background:#6c5ce7; border:none; border-radius:10px;">
    🎨 GENERATE SCENE IMAGES
</button>

<div id="sceneImages" style="margin-top:30px;"></div>
    </div>


    <!-- IMAGE HISTORY -->

    <h2 style="margin-top:50px; color:#fff;">
        🖼️ Image History
    </h2>

    <div
        id="gallery"
        style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:20px;">
    </div>

    <button
        type="button"
        onclick="clearImage()"
        style="margin-top:20px; padding:12px 24px; font-size:16px; font-weight:bold; color:white; background:#333; border:none; border-radius:8px;">
        🗑️ CLEAR / NEW IMAGE
    </button>

    <button
        type="button"
        onclick="deleteAllHistory()"
        style="margin-top:20px; padding:12px 24px; font-size:16px; font-weight:bold; color:white; background:#8b0000; border:none; border-radius:8px;">
        🗑️ DELETE ALL HISTORY
    </button>


<script>

    let imageDB = null;

    const dbRequest = indexedDB.open("ImageGeneratorDB", 2);

    dbRequest.onupgradeneeded = function(event) {

        const db = event.target.result;

        if (!db.objectStoreNames.contains("images")) {
            db.createObjectStore("images", {
                autoIncrement: true
            });
        }
    };

    dbRequest.onsuccess = function() {

        imageDB = dbRequest.result;

        console.log("Image database ready.");

        loadGallery();
    };

    dbRequest.onerror = function() {

        console.error(
            "Database error:",
            dbRequest.error
        );
    };


    async function generateImage() {

        const prompt =
            document.getElementById("prompt").value;

        const aspectRatio =
            document.getElementById("aspectRatio").value;

        const result =
            document.getElementById("result");

        if (!prompt.trim()) {

            result.innerHTML =
                "Please enter a prompt.";

            return;
        }

        result.innerHTML =
            "Generating...";

        try {

            const response = await fetch(
                "/api/generate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        prompt: prompt,
                        aspectRatio: aspectRatio
                    })
                }
            );

            if (!response.ok) {

                result.innerHTML =
                    "Something went wrong.";

                return;
            }

            const blob =
                await response.blob();

            const imageUrl =
                URL.createObjectURL(blob);


            if (imageDB) {

                const transaction =
                    imageDB.transaction(
                        "images",
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        "images"
                    );

                const request =
                    store.add(blob);

                request.onsuccess =
                    function() {

                        addGalleryImage(
                            blob,
                            request.result
                        );
                    };
            }


            result.innerHTML = `
                <img
                    src="${imageUrl}"
                    style="display:block; max-width:500px; width:100%; height:auto; margin:20px auto;"
                >

                <br>

                <a
                    href="${imageUrl}"
                    download="generated-image.png"
                    style="display:inline-block; padding:12px 24px; background:#333; color:white; text-decoration:none; border-radius:8px; font-weight:bold;"
                >
                    ⬇️ DOWNLOAD IMAGE
                </a>
            `;

        } catch (error) {

            console.error(error);

            result.innerHTML =
                "Something went wrong.";
        }
    }


    async function planStory() {

        const paragraph =
            document.getElementById("storyPrompt").value;

        const storyResult =
            document.getElementById("storyResult");

        if (!paragraph.trim()) {

            storyResult.innerHTML =
                "Please enter a paragraph.";

            return;
        }

        storyResult.innerHTML =
            "🧠 Planning your story...";


        try {

            const response =
                await fetch(
                    "/api/planscenes",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            paragraph:
                                paragraph
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                storyResult.innerHTML =
                    "Story planning failed: " +
                    (data.error ||
                        "Unknown error.");

                return;
            }


            let html = `
                <h2>${escapeHtml(data.title || "Your Story")}</h2>

                <p style="color:#aaa;">
                    ${escapeHtml(data.style || "")}
                </p>
            `;


            data.scenes.forEach(function(scene) {

                html += `
                    <div class="scene">

                        <h3>
                            Scene ${scene.scene}
                        </h3>

                        <p>
                            <strong>Description:</strong><br>
                            ${escapeHtml(scene.description)}
                        </p>

                        <p>
                            <strong>Visual Prompt:</strong><br>
                            ${escapeHtml(scene.visual_prompt)}
                        </p>

                        <p style="color:#aaa;">
                            Duration:
                            ${scene.duration || 5}
                            seconds
                        </p>

                    </div>
                `;
            });


            storyResult.innerHTML = html;


        } catch (error) {

            console.error(error);

            storyResult.innerHTML =
                "Story planning failed.";
        }
    }

async function generateSceneImages() {

    const sceneImages =
        document.getElementById("sceneImages");

    const sceneElements =
        document.querySelectorAll(".scene");

    if (!sceneElements.length) {
        sceneImages.innerHTML =
            "Please plan a story first.";
        return;
    }

    sceneImages.innerHTML =
        "<h2>🎨 Generating Scene Images...</h2>";

    for (let i = 0; i < sceneElements.length; i++) {

        const scene =
            sceneElements[i];

        const promptElement =
            scene.querySelector("p:nth-of-type(2)");

        const prompt =
            promptElement
                ? promptElement.innerText
                    .replace("Visual Prompt:", "")
                    .trim()
                : "";

        if (!prompt) {
            continue;
        }

        const imageBox =
            document.createElement("div");

        imageBox.style.margin =
            "30px auto";

        imageBox.innerHTML =
            `<h3>🎬 Scene ${i + 1}</h3>
             <p>Generating image...</p>`;

        sceneImages.appendChild(imageBox);

        try {

            const response =
                await fetch(
                    "/api/generate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            prompt: prompt
                        })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Image generation failed."
                );
            }

            const blob =
                await response.blob();

            const imageUrl =
                URL.createObjectURL(blob);

            imageBox.innerHTML =
                `<h3>🎬 Scene ${i + 1}</h3>
                 <img
                    src="${imageUrl}"
                    style="display:block; max-width:500px; width:100%; height:auto; margin:15px auto; border-radius:12px;"
                 >
                 <a
                    href="${imageUrl}"
                    download="scene-${i + 1}.png"
                    style="display:inline-block; padding:10px 20px; background:#333; color:white; text-decoration:none; border-radius:8px;"
                 >
                    ⬇️ DOWNLOAD SCENE
                 </a>`;

        } catch (error) {

            console.error(error);

            imageBox.innerHTML =
                `<h3>🎬 Scene ${i + 1}</h3>
                 <p>❌ Image generation failed.</p>`;
        }
    }
}
    
    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text || "";

        return div.innerHTML;
    }


    function addGalleryImage(blob, key) {

        const imageUrl =
            URL.createObjectURL(blob);

        const galleryImage =
            document.createElement("img");

        galleryImage.src =
            imageUrl;

        galleryImage.style.width =
            "200px";

        galleryImage.style.cursor =
            "pointer";

        galleryImage.style.borderRadius =
            "10px";


        galleryImage.onclick =
            function() {

                window.open(
                    imageUrl,
                    "_blank"
                );
            };


        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "🗑️ DELETE";

        deleteButton.style.display =
            "block";

        deleteButton.style.margin =
            "8px auto 20px";

        deleteButton.style.padding =
            "8px 16px";

        deleteButton.style.background =
            "#8b0000";

        deleteButton.style.color =
            "white";

        deleteButton.style.border =
            "none";

        deleteButton.style.borderRadius =
            "6px";

        deleteButton.style.cursor =
            "pointer";


        deleteButton.onclick =
            function() {

                const transaction =
                    imageDB.transaction(
                        "images",
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        "images"
                    );

                const request =
                    store.delete(key);


                request.onsuccess =
                    function() {

                        galleryImage.remove();

                        deleteButton.remove();

                        URL.revokeObjectURL(
                            imageUrl
                        );
                    };
            };


        document
            .getElementById("gallery")
            .appendChild(
                galleryImage
            );

        document
            .getElementById("gallery")
            .appendChild(
                deleteButton
            );
    }


    function loadGallery() {

        if (!imageDB) {
            return;
        }

        const transaction =
            imageDB.transaction(
                "images",
                "readonly"
            );

        const store =
            transaction.objectStore(
                "images"
            );

        const request =
            store.openCursor();


        request.onsuccess =
            function(event) {

                const cursor =
                    event.target.result;

                if (cursor) {

                    addGalleryImage(
                        cursor.value,
                        cursor.key
                    );

                    cursor.continue();
                }
            };
    }


    function clearImage() {

        document
            .getElementById("prompt")
            .value = "";

        document
            .getElementById("result")
            .innerHTML = "";
    }


    function deleteAllHistory() {

        if (!imageDB) {
            return;
        }

        const transaction =
            imageDB.transaction(
                "images",
                "readwrite"
            );

        const store =
            transaction.objectStore(
                "images"
            );

        store.clear();
    }

</script>

</body>
</html>
