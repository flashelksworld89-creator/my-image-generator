<!DOCTYPE html>
<html>
<head>
    <title>My Image Generator</title>
</head>
    
<body>
   <h1 style="font-size:42px; margin-bottom:10px; text-shadow:0 2px 10px rgba(0,0,0,0.5);">My AI Image Generator</h1>
<head>
    <title>My Image Generator</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
    </style>
  <p style="font-size:18px; color:#bbb; margin-bottom:25px;">
    Describe the image you want to create
</p>

   <textarea id="prompt" rows="6" cols="50"
    placeholder="Describe the image you want to create..."
    style="display:block; width:100%; max-width:600px; height:160px; margin:0 auto 25px; padding:15px; box-sizing:border-box; border-radius:12px; border:1px solid #444; background:#1c1c1c; color:white; font-size:16px; line-height:1.5; resize:vertical;"></textarea>

    <br><br>

  <button onclick="generateImage()" style="padding:14px 30px; font-size:18px; font-weight:bold; color:white; background:#6c5ce7; border:none; border-radius:10px; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.3);">
    ✨ GENERATE IMAGE
</button>

    <br><br>

   <div id="result" style="margin-top:30px;"></div>

<button type="button" onclick="clearImage()"
    style="margin-top:20px; padding:12px 24px; font-size:16px; font-weight:bold; color:white; background:#333; border:none; border-radius:8px; cursor:pointer;">
    🗑️ CLEAR / NEW IMAGE
</button>
    <script>
        async function generateImage() {
            const prompt = document.getElementById("prompt").value;
            const result = document.getElementById("result");

            result.innerHTML = "Generating...";

            const response = await fetch("/api/generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ prompt: prompt })
            });

            if (!response.ok) {
                result.innerHTML = "Something went wrong.";
                return;
            }

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);

          result.innerHTML = `
    <img src="${imageUrl}" style="display:block; max-width:500px; width:100%; height:auto; margin:20px auto;">
    <br>
    <a href="${imageUrl}" download="generated-image.png"
       style="display:inline-block; padding:12px 24px; background:#333; color:white; text-decoration:none; border-radius:8px; font-weight:bold;">
        ⬇️ DOWNLOAD IMAGE
    </a>
`;
    }

    function clearImage() {
    document.getElementById("prompt").value = "";
    document.getElementById("result").innerHTML = "";
}
    </script>
</body>
</html>
